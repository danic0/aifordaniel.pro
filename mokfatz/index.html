<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>רשימת קניות – מוקפץ</title>
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e8e2d8;--ok:#1f9d55;--okbg:#e8f6ee;--accent:#d9480f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:24px}
  .sub{margin:0 0 10px;color:var(--mute);font-size:14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .count{flex:1;font-weight:700;color:var(--accent);font-size:16px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:10px;cursor:pointer}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:12px 16px 80px;max-width:640px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
  h2{margin:0;padding:10px 14px;font-size:15px;background:#f3eee5;color:#5b5346}
  label{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);font-size:18px;cursor:pointer;user-select:none}
  label:first-of-type{border-top:0}
  input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:28px;height:28px;border:2px solid #c9c1b2;border-radius:8px;background:#fff;display:grid;place-content:center;margin:0}
  input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
  input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:20px;font-weight:700;line-height:1}
  label.done{background:var(--okbg);color:#4b6b58}
  label.done .name{text-decoration:line-through}
  .hint{font-size:13px;color:var(--mute)}
  .add{display:flex;gap:8px;margin:0 0 14px}
  .add input{flex:1;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .hero{margin:0 0 14px;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(217,72,15,.15)}
  .hero svg{display:block;width:100%;height:auto}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--mute);font-size:13px;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <h1>🥘 קניות למוקפץ</h1>
  <p class="sub">מסמנים ✓ על מה שיש במקרר. מה שנשאר בלי וי – צריך לקנות.</p>
  <div class="bar">
    <span class="count" id="count"></span>
    <button id="onlyMissing">רק מה שחסר</button>
    <button id="reset">איפוס</button>
  </div>
</header>
<main>
  <div class="hero" aria-hidden="true">
    <svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8cc"/><stop offset="1" stop-color="#ffd8a8"/></linearGradient>
        <linearGradient id="wok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f57"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
      </defs>
      <rect width="400" height="230" rx="18" fill="url(#bg)"/>
      <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".75">
        <path d="M150 80c-12-14 12-22 0-38"/><path d="M200 74c-12-14 12-22 0-38"/><path d="M250 80c-12-14 12-22 0-38"/>
      </g>
      <rect x="318" y="128" width="78" height="14" rx="7" fill="#6b3f1d" transform="rotate(-8 318 135)"/>
      <path d="M52 112h296c0 62-60 96-148 96S52 174 52 112z" fill="url(#wok)"/>
      <ellipse cx="200" cy="112" rx="148" ry="22" fill="#2b2f36"/>
      <ellipse cx="200" cy="110" rx="138" ry="16" fill="#a0521d" opacity=".55"/>
      <g stroke="#e9c27a" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M95 110q12-10 24 0t24 0t24 0"/><path d="M230 112q12-10 24 0t24 0t24 0"/><path d="M150 118q12-8 24 0t24 0"/>
      </g>
      <g>
        <rect x="108" y="92" width="34" height="14" rx="7" fill="#f08c00" transform="rotate(-20 125 99)"/>
        <rect x="262" y="90" width="34" height="14" rx="7" fill="#f08c00" transform="rotate(25 279 97)"/>
        <rect x="176" y="84" width="30" height="16" rx="4" fill="#e03131" transform="rotate(12 191 92)"/>
        <rect x="222" y="94" width="28" height="15" rx="4" fill="#fcc419" transform="rotate(-14 236 101)"/>
        <rect x="140" y="98" width="28" height="14" rx="4" fill="#fcc419" transform="rotate(8 154 105)"/>
        <rect x="296" y="98" width="26" height="14" rx="4" fill="#e03131" transform="rotate(-10 309 105)"/>
        <circle cx="160" cy="86" r="11" fill="#2f9e44"/><circle cx="171" cy="82" r="9" fill="#37b24d"/><circle cx="152" cy="90" r="8" fill="#2b8a3e"/>
        <circle cx="258" cy="82" r="10" fill="#37b24d"/><circle cx="270" cy="88" r="8" fill="#2f9e44"/>
        <ellipse cx="210" cy="104" rx="13" ry="8" fill="#d9c5a3"/><ellipse cx="124" cy="108" rx="11" ry="7" fill="#d9c5a3"/>
        <rect x="190" y="98" width="30" height="8" rx="4" fill="#82c91e" transform="rotate(-6 205 102)"/>
      </g>
      <g fill="#fff"><circle cx="146" cy="100" r="2"/><circle cx="200" cy="92" r="2"/><circle cx="248" cy="104" r="2"/><circle cx="284" cy="104" r="2"/><circle cx="118" cy="98" r="2"/></g>
    </svg>
  </div>
  <form class="add" id="addForm">
    <input id="addInput" placeholder="להוסיף פריט לרשימה…" autocomplete="off">
    <button type="submit">הוסף</button>
  </form>
  <div id="list"></div>
</main>
<footer>הסימונים נשמרים במכשיר הזה</footer>

<script>
const DEFAULTS = {
  "🥕 ירקות": ["בצל","שום","גזר","פלפל אדום","פלפל צהוב","כרוב","ברוקולי","קישואים","פטריות","בצל ירוק","שעועית ירוקה","ג׳ינג׳ר טרי","תירס מיני","נבטים"],
  "🍗 חלבון": ["חזה עוף / סטייק","טופו","ביצים"],
  "🍜 בסיס": ["אטריות","אורז"],
  "🧂 רטבים ותבלינים": ["סויה","שמן שומשום","שמן לטיגון","רוטב צ׳ילי מתוק","רוטב צדפות","עמילן תירס (קורנפלור)","סוכר / דבש","שומשום","קשיו / בוטנים"]
};
const KEY = "mokfatz_v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ state = {}; }
state.checked = state.checked || {};
state.extra = state.extra || [];
state.onlyMissing = !!state.onlyMissing;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  const groups = Object.assign({}, DEFAULTS);
  if (state.extra.length) groups["➕ תוספות"] = state.extra;
  let total = 0, have = 0;
  for (const [title, items] of Object.entries(groups)) {
    const sec = document.createElement("section");
    const h = document.createElement("h2"); h.textContent = title; sec.appendChild(h);
    items.forEach(name => {
      total++;
      const isOn = !!state.checked[name]; if (isOn) have++;
      const lab = document.createElement("label");
      if (isOn) lab.className = "done";
      if (isOn && state.onlyMissing) lab.classList.add("hidden");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = isOn;
      cb.onchange = () => { state.checked[name] = cb.checked; save(); render(); };
      const sp = document.createElement("span"); sp.className = "name"; sp.textContent = name;
      lab.append(cb, sp); sec.appendChild(lab);
    });
    list.appendChild(sec);
  }
  document.getElementById("count").textContent = total - have === 0 ? "✅ הכול יש בבית!" : `חסר לקנות: ${total - have} מתוך ${total}`;
  document.getElementById("onlyMissing").classList.toggle("on", state.onlyMissing);
}

document.getElementById("onlyMissing").onclick = () => { state.onlyMissing = !state.onlyMissing; save(); render(); };
document.getElementById("reset").onclick = () => { if (confirm("לאפס את כל הסימונים?")) { state.checked = {}; save(); render(); } };
document.getElementById("addForm").onsubmit = e => {
  e.preventDefault();
  const v = document.getElementById("addInput").value.trim();
  if (v && !state.extra.includes(v)) { state.extra.push(v); save(); }
  document.getElementById("addInput").value = "";
  render();
};
render();
</script>
</body>
</html>
