<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חיבור מגדיל Wi-Fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* Layout idea: one big step per screen, thumb-reachable buttons at the bottom, calm teal on cool grey */
:root{
  --bg:#f2f6f8; --card:#ffffff; --ink:#14232b; --muted:#566872; --line:#d9e3e8;
  --accent:#0b7a86; --accent-ink:#ffffff; --accent-soft:#dff1f3; --good:#1f8a4c; --warn-bg:#fff4d6; --warn-ink:#6a4b00;
  --font:'Heebo','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a20; --card:#17262e; --ink:#eaf2f5; --muted:#9db1ba; --line:#2a3d47;
    --accent:#3ab7c4; --accent-ink:#06242a; --accent-soft:#16363d; --good:#52c283; --warn-bg:#3a2f12; --warn-ink:#f2d98b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a20; --card:#17262e; --ink:#eaf2f5; --muted:#9db1ba; --line:#2a3d47;
  --accent:#3ab7c4; --accent-ink:#06242a; --accent-soft:#16363d; --good:#52c283; --warn-bg:#3a2f12; --warn-ink:#f2d98b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
body{min-height:100%;font-size:20px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;gap:8px}
.top .label{font-size:16px;color:var(--muted);font-weight:500}
.bar{display:flex;gap:6px}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar i.on{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;line-height:1.25;margin:0;font-weight:800;text-wrap:balance}
.num{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:22px;flex:none}
.head{display:flex;align-items:center;gap:12px}
ol.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.todo li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.todo li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;margin-top:2px}
b{font-weight:700}
bdi,.ltr{direction:ltr;unicode-bidi:isolate;font-weight:700}
.btns{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border-radius:16px;border:2px solid transparent;min-height:60px;padding:12px 18px;font-weight:700;font-size:21px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:active{transform:scale(.99)}
.ghost{background:transparent;color:var(--muted);border-color:var(--line);min-height:48px;font-size:17px;font-weight:500}
.copy{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);min-height:48px;font-size:18px}
details{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:12px 16px;font-size:18px}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0}
.note{font-size:17px;color:var(--muted);margin:0}
.vis{background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.vis svg{width:100%;height:auto;display:block}
.vis img{width:100%;height:auto;border-radius:12px;display:block}
.cap{font-size:16px;color:var(--muted);text-align:center;margin:0}
/* illustrations */
.wall{fill:var(--card)} .dev{fill:#f8fafb;stroke:#7e929c;stroke-width:2.5} .plate{fill:var(--line)}
.hole{fill:#7e929c} .ant{stroke:#7e929c;stroke-width:6;stroke-linecap:round} .wave{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.light{fill:var(--good)} .blink{animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.phone{border:3px solid #7e929c;border-radius:22px;background:var(--card);overflow:hidden;max-width:340px;width:100%;margin:0 auto}
.phone .bar2{padding:10px 14px;font-weight:800;border-bottom:1px solid var(--line);font-size:18px;background:var(--bg)}
.phone .row{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px}
.phone .row:last-child{border-bottom:0}
.phone .row.hl{background:var(--accent-soft);outline:3px solid var(--accent);outline-offset:-3px;font-weight:700}
.tag{font-size:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.url{margin:10px 12px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:8px 14px;direction:ltr;text-align:left;font-weight:700;font-size:19px}
.url.hl{border-color:var(--accent);background:var(--accent-soft)}
.search{margin:0 12px 12px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;color:var(--muted);font-size:16px}
.field{margin:12px;border:2px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:22px;letter-spacing:3px;direction:ltr;text-align:left;background:var(--card)}
.fakebtn{margin:0 12px 14px;background:var(--accent);color:var(--accent-ink);text-align:center;border-radius:12px;padding:10px;font-weight:800;font-size:19px}
.lbl{margin:10px 14px 0;font-size:15px;color:var(--muted)}
.done{display:flex;flex-direction:column;gap:12px}
.done ul{margin:0;padding:0 20px 0 0;display:flex;flex-direction:column;gap:8px}
.big{font-size:56px;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top" hidden>
    <div class="label" id="label"></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

var card = document.getElementById('card');
var top_ = document.getElementById('top');
var label = document.getElementById('label');
var bar = document.getElementById('bar');

function li(arr){ return arr.map(function(t){return '<li><span>'+t+'</span></li>';}).join(''); }

function render(){
  var s = steps[i], h = '';
  var numbered = !s.welcome && !s.done;
  top_.hidden = !numbered;
  if(numbered){
    label.textContent = 'צעד ' + i + ' מתוך ' + total;
    bar.innerHTML = Array.from({length:total}, function(_,k){ return '<i class="'+(k<i?'on':'')+'"></i>'; }).join('');
  }
  if(s.welcome){
    h += '<h1 tabindex="-1" id="h">'+s.title+'</h1><p style="margin:0">'+s.intro+'</p>';
    h += '<div><b>'+s.itemsTitle+'</b></div><ol class="todo" style="counter-reset:none">'+s.items.map(function(t){return '<li style="gap:10px"><span style="flex:none;color:var(--good);font-weight:800;margin-top:0">✓</span><span>'+t+'</span></li>';}).join('')+'</ol>';
  } else if(s.done){
    h += '<div class="big" aria-hidden="true">✓</div><h1 tabindex="-1" id="h">'+s.title+'</h1><p style="margin:0">המגדיל מחובר. עוד דבר אחד: המקום שלו.</p><div class="done"><ul>'+li(s.items)+'</ul></div>';
  } else {
    h += '<div class="head"><span class="num">'+i+'</span><h1 tabindex="-1" id="h">'+s.title+'</h1></div><ol class="todo">'+li(s.items)+'</ol>';
  }
  if(s.vis){ h += '<div class="vis">'+s.vis+(s.cap?'<p class="cap">'+s.cap+'</p>':'')+'</div>'; }
  if(s.help){ h += '<details><summary>'+(s.done?'אם משהו השתבש':'משהו לא עובד?')+'</summary><p>'+s.help+'</p></details>'; }
  h += '<div class="btns"><button class="primary" id="next" type="button">'+s.btn+'</button>'+(numbered?'<button class="ghost" id="back" type="button">חזרה לצעד הקודם</button>':'')+'</div>';
  card.innerHTML = h;

  document.getElementById('next').onclick = function(){
    i = s.done ? 0 : i + 1; go();
  };
  var b = document.getElementById('back'); if(b) b.onclick = function(){ i = Math.max(0,i-1); go(); };
  var c = document.getElementById('copyBtn');
  if(c) c.onclick = function(){
    var ok = function(){ c.textContent = 'הועתק'; setTimeout(function(){c.textContent='העתקת הכתובת';},2000); };
    try { navigator.clipboard.writeText('192.168.188.1').then(ok, function(){ c.textContent='192.168.188.1'; }); }
    catch(e){ c.textContent = '192.168.188.1'; }
  };
}
function go(){
  try { localStorage.setItem('wifi-step', String(i)); } catch(e){}
  render();
  window.scrollTo(0,0);
  var h = document.getElementById('h'); if(h) h.focus({preventScroll:true});
}
render();
</script>
</body>
</html>
