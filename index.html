<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI for Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f1; --fg:#1b1b1f; --muted:#6b6b73; --accent:#2f5bea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121216; --fg:#ececf1; --muted:#9a9aa4; --accent:#7d9bff; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:Rubik,system-ui,sans-serif;
         min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
  main { max-width:560px; }
  h1 { font-size:clamp(2rem,6vw,3rem); font-weight:600; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); margin-top:12px; line-height:1.6; font-size:1.05rem; }
  .proj { list-style:none; padding:0; margin-top:28px; display:grid; gap:12px; }
  .proj li { display:flex; flex-direction:column; gap:2px; }
  .proj a { color:var(--accent); font-weight:600; font-size:1.15rem; text-decoration:underline; text-underline-offset:3px; min-height:44px; display:inline-flex; align-items:center; }
  .proj span { color:var(--muted); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <h1>AI for <span>Daniel</span></h1>
  <p>האתר באוויר. כאן יעלו כלים, דפים ופרויקטים שאני בונה.</p>
  <ul class="proj">
    <li><a href="atto/">טסים עם ATTO</a><span>מסמכי טיסה לקלנועית, ישראל</span></li>
    <li><a href="atto-usa/" lang="en" dir="ltr">Fly with ATTO</a><span>Flight documents, USA</span></li>
  </ul>
</main>
</body>
</html>
